<!-- Content Security Policy: pertahanan lapis kedua terhadap XSS.
     'unsafe-inline' pada script TIDAK dipakai. Gaya inline diizinkan karena seluruh
     CSS aplikasi ditulis sebagai atribut style (tanpa itu layout pecah), tapi script
     hanya boleh dari origin sendiri. connect-src dibuka untuk provider AI pilihan user. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  font-src 'self';
  connect-src 'self' https:;
  media-src 'self' data: blob:;
  object-src 'none';
  frame-src 'none';
  frame-ancestors 'none';
  base-uri 'none';
  form-action 'none';
">
